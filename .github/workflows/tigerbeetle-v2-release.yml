name: Tigerbeetle V2 tagged CAD release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/tigerbeetle-v2-ci.yml
  cad:
    needs: quality
    uses: ./.github/workflows/tigerbeetle-v2-cad.yml
  publish:
    needs: [quality, cad]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: Verify downloaded release assets
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Publish complete immutable tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "$RELEASE_TAG"
