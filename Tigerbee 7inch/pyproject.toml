[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tigerbee"
version = "0.1.0"
description = "Tigerbee 7-inch FPV frame, 303 mm wheelbase, as build123d code"
requires-python = ">=3.12,<3.13"
dependencies = ["build123d>=0.11,<0.12"]

[project.scripts]
tigerbee = "tigerbee.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tigerbee"]
