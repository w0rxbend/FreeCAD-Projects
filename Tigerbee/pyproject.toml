[project]
name = "tigerbee-cad"
version = "0.1.0"
description = "Parametric Tigerbee FPV frame components and assembly"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["build123d==0.11.1"]

[project.scripts]
tigerbee = "tigerbee.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tigerbee"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<1",
    "mypy>=1.19,<3",
    "pip-audit>=2.10.1",
]
tracing = [
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.2.0",
]
viewer = ["ocp-vscode"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
