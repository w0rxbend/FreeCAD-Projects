name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Locate project
        id: project
        shell: bash
        run: |
          if [[ -f pyproject.toml && -f src/fpv_frame/cli.py ]]; then
            echo 'dir=.' >> "$GITHUB_OUTPUT"
          elif [[ -f 'Tigerbeetle V2/pyproject.toml' ]]; then
            echo 'dir=Tigerbeetle V2' >> "$GITHUB_OUTPUT"
          else
            echo 'Cannot locate fpv-frame project' >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.11'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Frozen dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: uv sync --frozen
      - name: Lint
        working-directory: ${{ steps.project.outputs.dir }}
        run: uv run --frozen ruff check .
      - name: Types
        working-directory: ${{ steps.project.outputs.dir }}
        run: uv run --frozen mypy
      - name: Unit, geometry, symmetry, interface, assembly and export tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: uv run --frozen pytest --junitxml=artifacts/reports/tests.xml
      - name: Five preset assembly gates
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          mkdir -p artifacts/reports
          for preset in reference default minimum_supported maximum_supported tolerance_test; do
            uv run --frozen fpv-frame --preset "$preset" validate > "artifacts/reports/validate-$preset.json"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-reports
          path: ${{ steps.project.outputs.dir }}/artifacts/reports/
          if-no-files-found: error
