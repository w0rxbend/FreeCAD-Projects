[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fpv-frame"
version = "0.1.0"
description = "Parametric reconstruction of the Tigerbeetle FPV frame"
requires-python = ">=3.12,<3.13"
dependencies = ["build123d>=0.11,<0.12", "Pillow>=11,<13", "PyYAML>=6,<7"]

[project.scripts]
fpv-frame = "fpv_frame.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-Pillow"]

[tool.hatch.build.targets.wheel]
packages = ["src/fpv_frame"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/fpv_frame"]
