[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tigerbeetle-v2"
version = "0.1.0"
description = "Tigerbeetle V2 6-inch HD: a wide-X frame in the Tiger Beetle style for a digital video system"
requires-python = ">=3.12,<3.13"
dependencies = ["zhalo"]

[project.optional-dependencies]
fea = ["gmsh>=4.11", "scikit-fem>=10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "vtk>=9.3", "pillow>=10", "gmsh>=4.11", "scikit-fem>=10"]

[project.scripts]
tigerbeetle-v2 = "tigerbeetle_v2.__main__:main"

[tool.uv.sources]
zhalo = { path = "../Zhalo-5inch", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tigerbeetle_v2"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
