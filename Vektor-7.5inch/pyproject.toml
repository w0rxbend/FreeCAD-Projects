[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vektor"
version = "0.1.0"
description = "Vektor 7.5-inch: a long-range frame whose arms are box beams of two carbon skins"
requires-python = ">=3.12,<3.13"
dependencies = ["build123d>=0.9", "numpy>=1.26", "ezdxf>=1.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "vtk>=9.3", "pillow>=10", "scipy>=1.13"]

[project.scripts]
vektor = "vektor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vektor"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
