[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zhalo"
version = "0.1.0"
description = "Zhalo 5-inch FPV frame (bee style) and its TPU accessories as build123d code"
requires-python = ">=3.12,<3.13"
dependencies = ["build123d>=0.11,<0.12"]

[project.optional-dependencies]
render = ["vtk>=9.3", "pillow>=10"]
fea = ["gmsh>=4.11", "scikit-fem>=10"]  # gmsh also needs the system library libGLU (apt: libglu1-mesa)

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "vtk>=9.3", "pillow>=10", "gmsh>=4.11", "scikit-fem>=10"]

[project.scripts]
zhalo = "zhalo.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zhalo"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
